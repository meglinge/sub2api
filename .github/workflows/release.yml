name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: true
        type: string
      simple_release:
        description: 'Simple release: only linux/amd64 GHCR image (fast, recommended)'
        required: false
        type: boolean
        default: true

# Fast path mirrors cch-api (cdk-server / cdk-admin-ui):
#   docker/build-push-action + cache-from/to type=gha,mode=max
# Warm builds reuse pnpm/go/apk layers; cold still slower.
permissions:
  contents: write
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # FAST PATH — same caching model as cch-api build-server / build-admin
  # ---------------------------------------------------------------------------
  release-fast:
    if: ${{ github.event.inputs.simple_release != 'false' && vars.FULL_RELEASE != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME=${{ github.event.inputs.tag }}
          else
            TAG_NAME=${GITHUB_REF#refs/tags/}
          fi
          VERSION=${TAG_NAME#v}
          OWNER_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          {
            echo "tag=$TAG_NAME"
            echo "version=$VERSION"
            echo "image=ghcr.io/${OWNER_LOWER}/sub2api"
          } >> "$GITHUB_OUTPUT"
          # IMPORTANT: do NOT rewrite backend/cmd/server/VERSION here.
          # That file is under COPY backend/ and would bust the entire Go layer
          # cache on every tag (the main reason warm builds stayed ~7min).
          # Version is injected via build-arg VERSION only.
          echo "Releasing $TAG_NAME ($VERSION)"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # cch-api pattern + registry buildcache (more reliable than GHA alone for large monorepos)
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          cache-from: |
            type=gha,scope=sub2api-amd64
            type=registry,ref=${{ steps.ver.outputs.image }}:buildcache
          cache-to: |
            type=gha,mode=max,scope=sub2api-amd64
            type=registry,ref=${{ steps.ver.outputs.image }}:buildcache,mode=max
          tags: |
            ${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.version }}
            ${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.version }}-amd64
            ${{ steps.ver.outputs.image }}:latest
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ github.sha }}
            FE_BUILD_CMD=build:ci
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          VERSION="${{ steps.ver.outputs.version }}"
          IMAGE="${{ steps.ver.outputs.image }}"
          NOTES=$(git tag -l --format='%(contents:body)' "$TAG" 2>/dev/null || true)
          {
            echo "> AI API Gateway Platform"
            echo "> ⚡ Fast release: linux/amd64 + GHA BuildKit cache (cch-api style)"
            echo
            if [ -n "$NOTES" ]; then echo "$NOTES"; echo; fi
            echo "## Docker"
            echo '```bash'
            echo "docker pull ${IMAGE}:${VERSION}"
            echo '```'
          } > /tmp/release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" --title "Sub2API ${VERSION}" --notes-file /tmp/release-notes.md
          fi

      - name: Sync VERSION on default branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          BRANCH="${{ github.event.repository.default_branch }}"
          git fetch origin "$BRANCH" --depth=1
          git checkout -B "$BRANCH" "origin/$BRANCH"
          CURRENT=$(tr -d '\r\n' < backend/cmd/server/VERSION || true)
          if [ "$CURRENT" = "$VERSION" ]; then
            exit 0
          fi
          printf '%s\n' "$VERSION" > backend/cmd/server/VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/cmd/server/VERSION
          git commit -m "chore: sync VERSION to ${VERSION} [skip ci]"
          git push origin "HEAD:$BRANCH"

  # ---------------------------------------------------------------------------
  # FULL PATH (opt-in multi-arch)
  # ---------------------------------------------------------------------------
  update-version:
    if: ${{ github.event.inputs.simple_release == 'false' || vars.FULL_RELEASE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=${{ github.event.inputs.tag }}; VERSION=${VERSION#v}
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "$VERSION" > backend/cmd/server/VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: version-file
          path: backend/cmd/server/VERSION
          retention-days: 1

  build-frontend:
    if: ${{ github.event.inputs.simple_release == 'false' || vars.FULL_RELEASE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: backend/internal/web/dist/
          retention-days: 1

  release-full:
    if: ${{ github.event.inputs.simple_release == 'false' || vars.FULL_RELEASE == 'true' }}
    needs: [update-version, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: version-file
          path: backend/cmd/server/
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: backend/internal/web/dist/
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: git fetch --tags --force
      - id: tag_message
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then TAG_NAME=${{ github.event.inputs.tag }}; else TAG_NAME=${GITHUB_REF#refs/tags/}; fi
          echo "message<<EOF" >> $GITHUB_OUTPUT
          git tag -l --format='%(contents:body)' "$TAG_NAME" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - id: lowercase
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_MESSAGE: ${{ steps.tag_message.outputs.message }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ steps.lowercase.outputs.owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'skip' }}
